<style>
  :root {
    --bg: #ffffff;
    --fg: #1f2328;
    --muted: #656d76;
    --border: #d8dee4;
    --accent: #0969da;
    --ok: #1a7f37;
    --ng: #cf222e;
    --warn: #9a6700;
    --surface: #f6f8fa;
    --diff-bg: #fff8c5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 16px 24px 32px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue',
                 'Hiragino Sans', 'Noto Sans JP', Meiryo, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 16px;
  }

  h1 { font-size: 19px; margin: 0 0 2px; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; }
  .meta { color: var(--muted); font-size: 12px; }

  .header-actions { display: flex; align-items: center; gap: 10px; white-space: nowrap; }

  .badge {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 13px;
    font-weight: 600;
  }

  button {
    font: inherit;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #eaeef2; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.primary:hover:not(:disabled) { background: #15682d; }
  button.danger { background: #fff; border-color: var(--ng); color: var(--ng); }
  button.danger:hover:not(:disabled) { background: #ffebe9; }
  button.link {
    background: none; border: none; color: var(--accent);
    padding: 0; text-decoration: underline;
  }

  /* ---- レイアウト ---- */

  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

  .queue { position: sticky; top: 16px; }

  .queue-count {
    font-size: 12px;
    color: var(--muted);
    padding: 0 2px 6px;
  }

  .more {
    width: 100%;
    margin-top: 8px;
  }

  .queue-list {
    max-height: 70vh;
    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  .queue-item {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    background: none;
    padding: 8px 12px;
  }
  .queue-item.active { background: #ddf4ff; }
  .qid { font-weight: 600; margin-right: 6px; }
  .qtitle { display: block; color: var(--muted); font-size: 12px; }
  .gen {
    font-size: 11px;
    background: var(--warn);
    color: #fff;
    border-radius: 999px;
    padding: 1px 7px;
  }

  /* ---- 明細 ---- */

  .detail-head { margin-bottom: 10px; }
  .toggle { display: inline-block; margin-bottom: 10px; font-size: 13px; }

  table.compare { border-collapse: collapse; width: 100%; }

  table.compare th, table.compare td {
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    font-weight: normal;
  }

  table.compare thead th {
    font-weight: 600;
    color: var(--muted);
    font-size: 12px;
    border-bottom: 2px solid var(--border);
  }

  table.compare tbody th { width: 22%; color: var(--muted); font-size: 13px; }
  table.compare td.current { width: 33%; }

  tr.is-diff th, tr.is-diff td.current { background: var(--diff-bg); }
  tr.is-diff th { font-weight: 700; color: var(--fg); }
  tr.is-diff input.val { font-weight: 700; border-color: var(--warn); }

  input.val {
    font: inherit;
    width: 100%;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .empty { color: var(--muted); }
  .tag {
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 5px;
    color: var(--muted);
  }

  .tag-merge { border-color: var(--accent); color: var(--accent); }

  .actions { display: flex; gap: 10px; margin-top: 16px; }

  /* ---- 通知・状態 ---- */

  .banner { padding: 9px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
  .banner-ok { background: #dafbe1; color: var(--ok); }
  .banner-ng { background: #ffebe9; color: var(--ng); }
  .banner-warn { background: #fff8c5; color: var(--warn); }

  .status-ok { color: var(--ok); font-weight: 600; }
  .status-ng { color: var(--ng); font-weight: 600; }
  .status-warn { color: var(--warn); font-weight: 600; }

  footer { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 12px; }
</style>
